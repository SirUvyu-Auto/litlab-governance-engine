                    <div className="border-t border-slate-100 pt-2">
                      <span className="text-[10px] font-mono font-bold text-charcoal-600 uppercase block">Measurement Instrument & Sample Distribution:</span>
                      <p className="text-charcoal-700 leading-relaxed font-sans">{auditDetailElement.sampleDetails || 'Sample verified across production metrics with high instrument uptime.'}</p>
                    </div>
                  </div>
                </div>

                {/* 4. CONFIDENCE SCORE & SUPPORTING RATIONALE */}
                <div className="bg-pearl p-4 rounded-xl border border-slate-200 space-y-3">
                  <div className="flex items-center justify-between">
                    <span className="text-[10px] font-mono font-bold text-charcoal-500 uppercase tracking-wider flex items-center space-x-1.5">
                      <i data-lucide="calculator" className="w-3.5 h-3.5 text-maroon-800"></i>
                      <span>4. Confidence Score & Step-by-Step Derivation</span>
                    </span>
                    <span className="text-[10px] font-mono font-bold text-emerald-800 bg-emerald-50 px-2 py-0.5 rounded border border-emerald-200">
                      Score: {auditDetailElement.cs || (auditDetailElement.sq * 0.46 + auditDetailElement.vs * 0.31 + auditDetailElement.c * 0.23).toFixed(1)}%
                    </span>
                  </div>
                  <div className="bg-white p-3.5 rounded-lg border border-slate-200 space-y-3 font-mono text-xs">
                    <div className="bg-pearl p-2.5 rounded border border-slate-200 text-center font-bold text-charcoal-900">
                      Master Equation: CS = (SQ &times; 46%) + (VS &times; 31%) + (C &times; 23%)
                    </div>
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-2.5">
                      <div className="bg-pearl p-2.5 rounded border border-slate-200">
                        <span className="text-[9px] uppercase font-bold text-charcoal-500 block">Sample Quality (SQ):</span>
                        <span className="text-xs font-bold text-maroon-800">{auditDetailElement.sq}% &times; 0.46 = {(auditDetailElement.sq * 0.46).toFixed(2)} pts</span>
                        <span className="text-[9px] text-charcoal-400 block mt-1 font-sans">Formula: (SS&times;0.30) + (RR&times;0.35) + (IQ&times;0.20) + (RC&times;0.15)</span>
                      </div>
                      <div className="bg-pearl p-2.5 rounded border border-slate-200">
                        <span className="text-[9px] uppercase font-bold text-charcoal-500 block">Variable Stability (VS):</span>
                        <span className="text-xs font-bold text-emerald-700">{auditDetailElement.vs}% &times; 0.31 = {(auditDetailElement.vs * 0.31).toFixed(2)} pts</span>
                        <span className="text-[9px] text-charcoal-400 block mt-1 font-sans">Assessed at inception; verified across 2 cycles</span>
                      </div>
                      <div className="bg-pearl p-2.5 rounded border border-slate-200">
                        <span className="text-[9px] uppercase font-bold text-charcoal-500 block">Consistency (C):</span>
                        <span className="text-xs font-bold text-amber-700">{auditDetailElement.c}% &times; 0.23 = {(auditDetailElement.c * 0.23).toFixed(2)} pts</span>
                        <span className="text-[9px] text-charcoal-400 block mt-1 font-sans">Formula: (BC&times;0.60) + (TC&times;0.40)</span>
                      </div>
                    </div>
                    <div className="border-t border-slate-100 pt-2 font-sans text-xs">
                      <span className="text-[10px] font-mono font-bold text-charcoal-700 uppercase block">Supporting Rationale:</span>
                      <p className="text-charcoal-600 leading-relaxed mt-0.5">{auditDetailElement.confidenceRationale || 'Empirical evidence supports high confidence.'}</p>
                    </div>
                  </div>
                </div>

                {/* 5. VALIDATION FINDINGS & UNRESOLVED ISSUES */}
                <div className="bg-pearl p-4 rounded-xl border border-slate-200 space-y-3">
                  <span className="text-[10px] font-mono font-bold text-charcoal-500 uppercase tracking-wider flex items-center space-x-1.5">
                    <i data-lucide="shield-alert" className="w-3.5 h-3.5 text-maroon-800"></i>
                    <span>5. Validation Findings & Adversarial Issues Trace</span>
                  </span>
                  <div className="bg-white p-3.5 rounded-lg border border-slate-200 space-y-2.5 text-xs font-sans">
                    <div>
                      <span className="text-[10px] font-mono font-bold text-emerald-800 uppercase block">Stage 2 Multi-Pass Adversarial Findings:</span>
                      <p className="text-charcoal-700 leading-relaxed mt-0.5">{auditDetailElement.validationFindings || 'Cross-examination stress tests verified parameter resilience.'}</p>
                    </div>
                    <div className="border-t border-slate-100 pt-2">
                      <span className="text-[10px] font-mono font-bold text-amber-800 uppercase block">Unresolved Issues & Risk Flags:</span>
                      <p className="text-charcoal-700 leading-relaxed mt-0.5">{auditDetailElement.unresolvedIssues || 'No open blocking issues.'}</p>
                    </div>
                  </div>
                </div>

                {/* 6. CURRENT STATUS & IMMUTABLE AUDIT HISTORY */}
                <div className="bg-pearl p-4 rounded-xl border border-slate-200 space-y-3">
                  <div className="flex items-center justify-between">
                    <span className="text-[10px] font-mono font-bold text-charcoal-500 uppercase tracking-wider flex items-center space-x-1.5">
                      <i data-lucide="history" className="w-3.5 h-3.5 text-maroon-800"></i>
                      <span>6. Current Status & Immutable Audit History</span>
                    </span>
                    <span className="px-2.5 py-0.5 rounded text-[10px] font-mono font-bold bg-emerald-100 text-emerald-900 border border-emerald-300">
                      {auditDetailElement.status || 'Locked & Verified'}
                    </span>
                  </div>
                  <div className="bg-white rounded-lg border border-slate-200 overflow-hidden font-mono text-[11px]">
                    <table className="w-full text-left">
                      <thead className="bg-pearl border-b border-slate-200 text-charcoal-500 text-[10px] uppercase">
                        <tr>
                          <th className="p-2.5">Timestamp</th>
                          <th className="p-2.5">Audit Actor</th>
                          <th className="p-2.5">Verification Action</th>
                          <th className="p-2.5 text-right">Cryptographic Digest</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-100">
                        {(auditDetailElement.auditHistory || []).map((entry, idx) => (
                          <tr key={idx} className="hover:bg-slate-50 transition-colors">
                            <td className="p-2.5 text-charcoal-500 text-[10px]">{entry.date}</td>
                            <td className="p-2.5 text-maroon-800 font-bold">{entry.actor}</td>
                            <td className="p-2.5 text-charcoal-700 font-sans text-xs">{entry.action}</td>
                            <td className="p-2.5 text-charcoal-400 text-right text-[10px]">{entry.checksum}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>

              </div>

              {/* DRAWER FOOTER */}
              <div className="p-4 border-t border-slate-200 bg-pearl flex items-center justify-between">
                <span className="text-[10px] font-mono text-charcoal-500">
                  CP-ARCH-001 Actuarial Governance Standard &bull; Tamper-Proof Audit
                </span>
                <div className="flex items-center space-x-2">
                  <button
                    onClick={() => setShowElementDetailDrawer(false)}
                    className="px-4 py-2 rounded-xl text-xs font-mono text-charcoal-600 hover:text-charcoal-900 border border-slate-200 bg-white"
                  >
                    Close Drawer
                  </button>
                  <button
                    onClick={() => {
                      setSelectedElementId(auditDetailElement.id);
                      setShowElementDetailDrawer(false);
                    }}
                    className="glow-button px-5 py-2 rounded-xl font-heading font-bold text-xs uppercase tracking-wider"
                  >
                    Focus In Calibrator &rarr;
                  </button>
                </div>
              </div>
            </div>
          </div>
        )}

        {/* ATTACHMENT PREVIEW MODAL */}
        {previewDocument && (
          <div className="fixed inset-0 z-50 bg-charcoal-900/60 backdrop-blur-sm flex items-center justify-center p-4 overflow-y-auto">
            <div className="bg-white border border-slate-200 rounded-2xl max-w-4xl w-full max-h-[90vh] shadow-2xl flex flex-col overflow-hidden animate-in fade-in zoom-in-95 duration-200">
              {/* MODAL HEADER */}
              <div className="p-5 border-b border-slate-100 flex items-center justify-between bg-pearl">
                <div className="flex items-center space-x-3.5">
                  <div className={`w-10 h-10 rounded-xl flex items-center justify-center font-mono font-bold text-xs ${
                    previewDocument.type === 'PDF' ? 'bg-red-50 text-red-700 border border-red-200' :
                    previewDocument.type === 'XLSX' ? 'bg-emerald-50 text-emerald-700 border border-emerald-200' :
                    previewDocument.type === 'DOCX' ? 'bg-blue-50 text-blue-700 border border-blue-200' :
                    'bg-maroon-50 text-maroon-800 border border-maroon-200'
                  }`}>
                    {previewDocument.type}
                  </div>
                  <div>
                    <div className="flex items-center space-x-2">
                      <span className="text-[10px] font-mono font-bold uppercase tracking-wider text-charcoal-500">
                        {previewDocument.previewCategory || 'Ingested Document Record'}
                      </span>
                      <span className="px-2 py-0.5 rounded text-[10px] font-mono font-bold bg-emerald-100 text-emerald-800 border border-emerald-200">
                        SHA-256 VERIFIED
                      </span>
                    </div>
                    <h3 className="font-heading font-bold text-base text-charcoal-900 mt-0.5">
                      {previewDocument.name}
                    </h3>
                  </div>
                </div>

                <div className="flex items-center space-x-2">
                  <span className="text-xs font-mono text-charcoal-500 bg-white px-2.5 py-1 rounded-lg border border-slate-200">
                    {previewDocument.size}
                  </span>
                  <button
                    onClick={() => setPreviewDocument(null)}
                    className="p-2 rounded-xl text-charcoal-400 hover:text-charcoal-700 hover:bg-white border border-transparent hover:border-slate-200 transition-colors"
                  >
                    <i data-lucide="x" className="w-5 h-5"></i>
                  </button>
                </div>
              </div>

              {/* MODAL BODY (SCROLLABLE) */}
              <div className="p-6 overflow-y-auto space-y-6 max-h-[calc(90vh-140px)]">
                {/* DOCUMENT INTEGRITY & METADATA BAR */}
                <div className="bg-pearl p-4 rounded-xl border border-slate-200 grid grid-cols-1 md:grid-cols-3 gap-3 font-mono text-xs">
                  <div>
                    <span className="text-[10px] text-charcoal-400 block uppercase font-bold">DIGEST CHECKSUM</span>
                    <span className="text-charcoal-800 font-bold break-all text-[11px] mt-0.5 block">
                      {previewDocument.hash || 'sha256:7f49a1b2c3d4e5f6...'}
                    </span>
                  </div>
                  <div>
                    <span className="text-[10px] text-charcoal-400 block uppercase font-bold">SECURITY CLEARANCE</span>
                    <span className="text-emerald-700 font-bold text-xs mt-0.5 block flex items-center space-x-1">
                      <i data-lucide="shield-check" className="w-3.5 h-3.5"></i>
                      <span>Ingestion Integrity Passed</span>
                    </span>
                  </div>
                  <div>
                    <span className="text-[10px] text-charcoal-400 block uppercase font-bold">PARSER ENGINE</span>
                    <span className="text-maroon-800 font-bold text-xs mt-0.5 block">
                      Multi-Format Parser v1.6
                    </span>
                  </div>
                </div>

                {/* STRUCTURED PREVIEW SECTIONS (FOR PDF / DOCX) */}
                {previewDocument.previewSections && previewDocument.previewSections.length > 0 && (
                  <div className="space-y-4">
                    <div className="flex items-center justify-between border-b border-slate-100 pb-2">
                      <h4 className="font-heading font-bold text-xs text-charcoal-900 uppercase tracking-wider flex items-center space-x-1.5">
                        <i data-lucide="book-open" className="w-3.5 h-3.5 text-maroon-800"></i>
                        <span>Extracted Document Architecture & Sections</span>
                      </h4>
                      <span className="text-[10px] font-mono text-charcoal-500">
                        {previewDocument.previewSections.length} Sections Extracted
                      </span>
                    </div>

                    <div className="space-y-3">
                      {previewDocument.previewSections.map((sec, sIdx) => (
                        <div key={sIdx} className="p-4 rounded-xl border border-slate-200 bg-white hover:border-slate-300 transition-all space-y-2">
                          <div className="flex items-center justify-between">
                            <span className="font-heading font-bold text-xs text-charcoal-900">
                              {sec.title}
                            </span>
                            {sec.badge && (
                              <span className="px-2 py-0.5 rounded text-[10px] font-mono font-bold bg-maroon-50 text-maroon-800 border border-maroon-200">
                                {sec.badge}
                              </span>
                            )}
                          </div>
                          <p className="text-xs text-charcoal-600 leading-relaxed font-sans">
                            {sec.summary}
                          </p>
                          {sec.keyPoints && sec.keyPoints.length > 0 && (
                            <div className="bg-pearl p-3 rounded-lg border border-slate-100 space-y-1">
                              <span className="text-[10px] font-mono font-bold text-charcoal-500 uppercase block">Key Operational Clauses:</span>
                              <ul className="list-disc list-inside text-xs text-charcoal-700 space-y-0.5 font-sans">
                                {sec.keyPoints.map((kp, kpIdx) => (
                                  <li key={kpIdx}>{kp}</li>
                                ))}
                              </ul>
                            </div>
                          )}
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {/* SPREADSHEET TELEMETRY DATA TABLE (FOR XLSX) */}
                {previewDocument.tableHeaders && previewDocument.tableRows && (
                  <div className="space-y-3">
                    <div className="flex items-center justify-between border-b border-slate-100 pb-2">
                      <h4 className="font-heading font-bold text-xs text-charcoal-900 uppercase tracking-wider flex items-center space-x-1.5">
                        <i data-lucide="table" className="w-3.5 h-3.5 text-emerald-700"></i>
                        <span>Structured Telemetry Matrix Sample</span>
                      </h4>
                      <span className="text-[10px] font-mono text-emerald-700 font-bold bg-emerald-50 px-2 py-0.5 rounded border border-emerald-200">
                        {previewDocument.tableRows.length} Rows &bull; Live Telemetry Feed
                      </span>
                    </div>

                    <div className="border border-slate-200 rounded-xl overflow-hidden shadow-2xs font-mono text-xs">
                      <div className="overflow-x-auto">
                        <table className="w-full text-left">
                          <thead className="bg-pearl border-b border-slate-200 text-charcoal-600 text-[11px] uppercase">
                            <tr>
                              {previewDocument.tableHeaders.map((th, thIdx) => (
                                <th key={thIdx} className="p-3 font-bold">{th}</th>
                              ))}
                            </tr>
                          </thead>
                          <tbody className="divide-y divide-slate-100 bg-white">
                            {previewDocument.tableRows.map((row, rIdx) => (
                              <tr key={rIdx} className="hover:bg-slate-50 transition-colors">
                                {row.map((cell, cIdx) => (
                                  <td key={cIdx} className={`p-3 text-[11px] ${cIdx === 0 ? 'font-bold text-charcoal-900' : cIdx === 1 ? 'text-maroon-800' : 'text-charcoal-600'}`}>
                                    {cell}
                                  </td>
                                ))}
                              </tr>
                            ))}
                          </tbody>
                        </table>
                      </div>
                    </div>
                  </div>
                )}

                {/* RAW EXTRACTED TEXT OR SPEC CONTENT */}
                {previewDocument.full_text && (
                  <div className="space-y-2">
                    <div className="flex items-center justify-between">
                      <span className="text-[10px] font-mono font-bold text-charcoal-500 uppercase tracking-wider flex items-center space-x-1.5">
                        <i data-lucide="file-text" className="w-3.5 h-3.5 text-maroon-800"></i>
                        <span>Ingested Raw Specification & Directives</span>
                      </span>
                      <span className="text-[10px] font-mono text-charcoal-400">
                        {previewDocument.full_text.length.toLocaleString()} Characters
                      </span>
                    </div>
                    <div className="p-4 rounded-xl bg-pearl border border-slate-200 text-charcoal-800 font-mono text-xs leading-relaxed max-h-60 overflow-y-auto whitespace-pre-wrap">
                      {previewDocument.full_text}
                    </div>
                  </div>
                )}
              </div>

              {/* MODAL FOOTER */}
              <div className="p-4 border-t border-slate-100 bg-pearl flex items-center justify-between">
                <span className="text-[10px] font-mono text-charcoal-500">
                  Ready for Pass 1 Ingestion Decomposition &bull; CP-ARCH-001 v1.6
                </span>
                <div className="flex items-center space-x-2">
                  <button
                    onClick={() => setPreviewDocument(null)}
                    className="px-4 py-2 rounded-xl text-xs font-mono text-charcoal-600 hover:text-charcoal-900 border border-slate-200 bg-white hover:bg-slate-50 transition-colors"
                  >
                    Close Preview
                  </button>
                  <button
                    onClick={() => {
                      setPreviewDocument(null);
                      handleExecutePipelineClick();
                    }}
                    className="glow-button px-5 py-2 rounded-xl font-heading font-bold text-xs uppercase tracking-wider flex items-center space-x-1.5"
                  >
                    <i data-lucide="play" className="w-3.5 h-3.5 fill-white"></i>
                    <span>Execute Pipeline &rarr;</span>
                  </button>
                </div>
              </div>
            </div>
          </div>
        )}
      </div>
    );
  }

  const root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(<LitLabApp />);
</script>
</body>
</html>
