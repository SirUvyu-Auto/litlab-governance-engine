services:
  - type: web
    name: litlab-governance-engine
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python -m uvicorn backend.server:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PORT
        value: 10000
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
